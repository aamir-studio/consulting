<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Closest Word | aamir.consulting</title>
<meta name="description" content="Type any three letters. The machine finds the nearest real word and shows you the neighbourhood around it.">
<style>
  :root { --ink:#111; --paper:#fff; --muted:#777; --faint:#bbb; --line:#ddd;
    --type: "American Typewriter", "Courier Prime", "Courier New", Courier, ui-monospace, monospace;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --L: clamp(46px, 11vw, 66px); }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); }
  body { min-height:100svh; display:flex; flex-direction:column; overflow-x:hidden; }

  header { padding:clamp(16px,3vw,32px) clamp(16px,4vw,48px) 0;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .titles { min-width:0; }
  .corner { flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .corner .logo { display:block; width:clamp(44px,5vw,60px); aspect-ratio:1; }
  .corner .logo img { display:block; width:100%; height:100%; object-fit:contain; border-radius:6px; }
  .logo-fallback { display:grid; place-items:center; width:100%; height:100%; font-family:var(--mono); font-size:12px; }
  .corner .home { font-size:clamp(14px,1.6vw,17px); color:var(--muted); text-decoration:none; }
  .corner .home:hover, .corner .home:focus-visible { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }
  h1 { margin:0; font-family:var(--type); font-size:clamp(22px,3.2vw,34px); font-weight:600; letter-spacing:-0.01em; }
  header p { margin:6px 0 0; color:var(--muted); font-size:clamp(14px,1.6vw,17px); }

  main { flex:1; width:min(780px, 100%); margin:0 auto; padding:clamp(14px,2.4vw,28px) clamp(16px,4vw,32px) 0;
    display:flex; flex-direction:column; }
  section { min-width:0; }

  /* ---- the top row: last find, the stamp with its enter key, the lamp ---- */
  .top { position:relative; display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"stamp stamp" "last last";
    justify-items:center; align-items:end; }
  .stamp { grid-area:stamp; display:grid; grid-template-columns:auto auto; column-gap:clamp(8px,1.6vw,14px);
    grid-template-areas:"handle ." "bands enter" "prompt ."; justify-items:center; align-items:end; }
  .handle { grid-area:handle; width:clamp(150px,36vw,230px); height:clamp(46px,9vw,62px); display:block; color:var(--ink); }
  .bands { grid-area:bands; position:relative; display:flex; border:2px solid var(--ink); border-radius:8px; padding:0 4px; cursor:text; background:#fff; }
  .band { position:relative; width:clamp(54px,13vw,78px); height:calc(var(--L) * 1.75); overflow:hidden;
    -webkit-mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent);
            mask-image:linear-gradient(transparent, #000 32%, #000 68%, transparent); }
  .band + .band { border-left:1px solid var(--line); }
  .strip { position:absolute; left:0; right:0; top:calc(var(--L) * -1.625); }
  .strip span { display:block; height:var(--L); line-height:var(--L); text-align:center;
    font-family:var(--type); font-size:calc(var(--L) * 0.78); color:#c4c4c4; }
  .strip span:nth-child(3) { color:var(--ink); }
  .band.empty .strip { visibility:hidden; }
  .band .gap { position:absolute; left:22%; right:22%; bottom:calc(var(--L) * 0.5); border-bottom:2px solid var(--ink); opacity:0; }
  .band.empty .gap { opacity:.25; }
  .band.empty.next .gap { opacity:1; animation:blink 1.1s steps(1) infinite; }
  .band.head { background:linear-gradient(transparent 30%, #f1f1f1 30%, #f1f1f1 70%, transparent 70%); }
  .bands.inked .strip span:nth-child(3) { font-weight:700; }
  /* After a find: the old word greys out and the first band blinks, ready for new letters. */
  .bands.ready { cursor:text; }
  .bands.ready .strip span:nth-child(3) { color:#a8a8a8; transition:color .6s ease; }
  .bands.ready .band:first-child .gap { opacity:1; animation:blink 1.1s steps(1) infinite; }
  .bands.nope { animation:nope .36s ease; }
  @keyframes nope { 20%,60% { transform:translateX(-7px); } 40%,80% { transform:translateX(7px); } }
  .top { --pr: calc(12px * 1.3 + 8px); --bh: calc(var(--L) * 1.75 + 4px); }
  .prompt { grid-area:prompt; margin:8px 0 0; font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); min-height:1.3em; text-align:center; }
  .prompt.go { color:var(--ink); }
  .prompt.go::after { content:""; display:inline-block; width:.6em; margin-left:.35em; border-bottom:2px solid currentColor;
    animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  /* The real input sits over the bands so phones open their keyboard. */
  #typer { position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; padding:0;
    font-size:16px; color:transparent; background:transparent; caret-color:transparent; cursor:text; }

  /* The enter key: a square the height of the bands, sitting right beside them. */
  .enter { all:unset; grid-area:enter; box-sizing:border-box; display:grid; place-items:center; cursor:pointer;
    width:calc(var(--L) * 1.75 + 4px); height:calc(var(--L) * 1.75 + 4px);
    border:2px solid var(--ink); border-radius:8px; background:var(--ink); color:#fff;
    transition:transform .08s ease, opacity .2s, background-color .2s; -webkit-tap-highlight-color:transparent; }
  .enter svg { width:46%; height:46%; }
  .enter:active { transform:translateY(2px) scale(.97); }
  .enter:disabled { cursor:default; opacity:1; background:#fff; color:#c8c8c8; border-color:#d6d6d6; transform:none; }
  .enter:focus-visible { outline:3px solid var(--line); outline-offset:3px; }

  /* ---- the lamp: on is the light page, off is the dark one ---- */
  .lamp { all:unset; position:absolute; top:0; right:0; cursor:pointer; width:clamp(40px,11vw,64px); color:#111;
    transition:color .6s ease; -webkit-tap-highlight-color:transparent; }
  .lamp svg { display:block; width:100%; overflow:visible; }
  .lamp .head { transform-box:view-box; transform-origin:50px 42px; }
  .lamp .bulb { fill:#fff; transition:fill .4s ease; }
  .lamp .rays { transition:opacity .4s ease; }
  .lamp:hover .rays { opacity:.6; }
  .lamp:focus-visible { outline:2px dashed #999; outline-offset:4px; border-radius:6px; }
  :root[data-theme="dark"] .lamp { color:#d8d8d8; }
  :root[data-theme="dark"] .lamp .bulb { fill:#000; }
  :root[data-theme="dark"] .lamp .rays { opacity:0; }
  :root[data-theme="dark"] .lamp:hover .rays { opacity:.35; }

  /* Dark mode is the machine inverted: ink turns to chalk, paper turns to night. */
  html, body { transition:background-color .6s ease; }
  :is(.stamp, .last, .left, .right, .foot) { transition:filter .6s ease; }
  :root[data-theme="dark"], :root[data-theme="dark"] body { background:#000; }
  :root[data-theme="dark"] :is(.stamp, .last, .left, .right, .foot) { filter:invert(1); }
  :root[data-theme="dark"] h1 { color:#eee; }
  :root[data-theme="dark"] header p, :root[data-theme="dark"] .corner .home { color:#8c8c8c; }
  :root[data-theme="dark"] .corner .home:hover { color:#eee; }


  /* ---- the last find: stamped on the left; a new one pushes it out to the left ---- */
  .last { grid-area:last; position:relative; display:grid; min-height:118px; margin-top:clamp(10px,2vw,16px); }
  .entry { grid-area:1 / 1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-family:var(--type); text-align:center; padding-top:8px; transition:opacity .5s ease; }
  .entry .from { font-size:15px; color:#444; min-height:1.35em; }
  .entry .word { display:inline-block; min-height:1.2em; min-width:2.2em; font-size:clamp(26px,3vw,34px); font-weight:700; line-height:1.1;
    border:2px solid var(--ink); border-radius:6px; padding:0 .32em .04em; letter-spacing:.04em; }
  .entry .word:empty { border-color:transparent; }
  .entry.intro .word { display:none; }
  .entry .word.press { animation:press .3s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes press { from { transform:scale(1.35) rotate(var(--r)); opacity:0; filter:blur(1.5px); } to { transform:rotate(var(--r)); } }
  .entry.out { animation:out .45s cubic-bezier(.4,0,.6,1) forwards; }
  @keyframes out { to { transform:translateX(-70%); opacity:0; } }
  .entry.in { animation:in .45s cubic-bezier(.3,.7,.3,1); }
  @keyframes in { from { transform:translateX(40%); opacity:0; } }
  .entry .dist { font-size:13.5px; color:#333; min-height:1.35em; }
  .entry .note { font-size:12px; color:#666; min-height:1.25em; }
  .entry.intro .from, .entry.intro .dist { font-size:15px; color:#555; }
  .wd { white-space:nowrap; }
  .ch { display:inline-block; white-space:pre; animation:strike .14s ease-out; }
  @keyframes strike { from { transform:translateY(-6px) scale(1.12); opacity:.4; } }
  .caret { display:inline-block; width:.55em; height:1em; vertical-align:-0.15em; border-bottom:2px solid var(--ink); animation:blink 1.1s steps(1) infinite; }

  /* ---- the click axes ---- */
  .axes { position:relative; height:clamp(150px, 25vw, 186px); margin:10px 0 0; }
  canvas { display:block; }
  #ax { position:absolute; inset:0; width:100%; height:100%; }
  .cap, .boxes figcaption { display:block; text-align:center; margin:6px 0 0; font-size:13px; color:var(--muted); }
  .boxes figcaption strong { color:var(--ink); font-family:var(--type); font-weight:600; }

  /* ---- the two boxes ---- */
  .boxes { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap:clamp(12px,3vw,28px);
    margin:clamp(14px,3vw,24px) 0 0; }
  .boxes figure { margin:0; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .boxwrap { position:relative; width:100%; aspect-ratio:4 / 3; margin:0 auto; }
  .box { position:absolute; left:0; top:0; width:100%; height:100%;
    border:1px solid var(--line); border-radius:6px; touch-action:pan-y; cursor:grab; }
  .box.dragging { cursor:grabbing; }

  /* ---- desktop: the whole machine on one screen ---- */
  @media (min-width:960px) and (min-height:600px) {
    body { height:100svh; min-height:0; }
    header { padding-top:clamp(12px,2vh,24px); }
    header p br { display:none; }
    main.machine { width:min(1440px, 100%); padding:0 clamp(24px,3vw,48px); min-height:0;
      display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto minmax(0,1fr);
      grid-template-areas:"top top" "left right"; column-gap:clamp(24px,3vw,56px); }
    :root { --L: clamp(34px, 6.2vh, 62px); }
    .handle { height:clamp(32px, 5.4vh, 58px); }
    .top { grid-area:top; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); grid-template-areas:"last stamp lamp"; column-gap:clamp(24px,3vw,56px); }
    .last { justify-self:end; align-self:end; min-height:0; height:var(--bh); margin:0 0 var(--pr); grid-template-rows:minmax(0,1fr); }
    .entry { padding-top:0; align-self:center; }
    .lamp { position:static; grid-area:lamp; justify-self:start; align-self:end; width:clamp(64px,7vw,96px); margin-bottom:var(--pr); }
    .left { grid-area:left; display:flex; flex-direction:column; min-height:0; padding-top:clamp(14px,3vh,32px); }
    .left .axes { flex:1; height:auto; min-height:110px; margin:0; }
    .right { grid-area:right; min-height:0; padding-top:clamp(14px,3vh,32px); }
    .right .boxes { height:100%; margin:0; grid-template-columns:1fr; }
    .boxwrap { flex:1; min-height:0; aspect-ratio:auto; max-width:none; }
    .foot { padding:6px 16px clamp(8px,1.4vh,16px); }
  }

  .foot { display:flex; justify-content:center; align-items:baseline; gap:20px; flex-wrap:wrap; padding:14px 16px clamp(20px,3vw,32px); }
  .foot .hint { font-size:12px; color:var(--faint); }
  .textbtn { all:unset; cursor:pointer; font-size:14px; color:var(--muted); }
  .textbtn:hover, .textbtn:focus-visible { color:var(--ink); text-decoration:underline; text-underline-offset:3px; }

</style>
</head>
<body>
  <header>
    <div class="titles">
      <h1>The Closest Word</h1>
      <p>Type any three letters. <br>The machine finds the nearest real word.</p>
    </div>
    <div class="corner">
      <a class="logo" href="../index.html" aria-label="aamir.consulting">
        <img src="../images/logo.png" alt="aamir.consulting logo"
             onerror="var p=this.parentNode;this.remove();p.insertAdjacentHTML('beforeend','<span class=logo-fallback>a.c</span>')">
      </a>
      <a class="home" href="index.html">Home</a>
    </div>
  </header>

  <main class="machine">
    <section class="top">
      <div class="last" id="last" aria-live="polite" aria-label="The last word found"></div>

      <div class="stamp" id="stamp">
        <svg class="handle" viewBox="0 0 230 62" aria-hidden="true">
          <ellipse cx="115" cy="13" rx="30" ry="10" fill="#111"/>
          <rect x="108" y="20" width="14" height="24" rx="2" fill="#111"/>
          <path d="M40 60 L56 44 H174 L190 60" fill="none" stroke="#111" stroke-width="2.2" stroke-linejoin="round"/>
        </svg>
        <div class="bands" id="bands">
          <div class="band"><div class="strip"></div><span class="gap"></span></div>
          <div class="band"><div class="strip"></div><span class="gap"></span></div>
          <div class="band"><div class="strip"></div><span class="gap"></span></div>
          <input id="typer" type="text" maxlength="3" autocomplete="off" autocorrect="off" autocapitalize="off"
                 spellcheck="false" enterkeyhint="go" aria-label="Type three letters">
        </div>
        <button class="enter" id="go" type="button" disabled aria-label="Return" title="Return">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v7.5H5.5M9.5 8.5 5.5 12.5l4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="prompt" id="prompt" aria-live="polite">Type three letters</p>
      </div>

      <button class="lamp" id="lamp" type="button" aria-pressed="true" aria-label="Switch the lamp off for dark mode" title="Switch the lamp off">
        <svg viewBox="0 0 100 109" aria-hidden="true">
          <g class="rays" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="28" y1="50" x2="22" y2="62"/><line x1="40" y1="52" x2="38" y2="66"/><line x1="72" y1="50" x2="78" y2="62"/>
          </g>
          <rect x="22" y="100" width="56" height="9" rx="3" fill="currentColor"/>
          <rect x="47" y="44" width="6" height="58" rx="2" fill="currentColor"/>
          <g class="head">
            <path d="M6 42 C6 22 26 14 50 14 C74 14 94 22 94 42 Z" fill="currentColor"/>
            <rect x="4" y="40" width="92" height="4" rx="2" fill="currentColor"/>
            <ellipse class="bulb" cx="50" cy="46" rx="11" ry="3.4" stroke="currentColor" stroke-width="1.6"/>
            <g class="chain"><line x1="66" y1="44" x2="66" y2="62" stroke="currentColor" stroke-width="1.4"/><circle cx="66" cy="64" r="2.6" fill="currentColor"/></g>
          </g>
        </svg>
      </button>
    </section>

    <section class="left" aria-label="Every word found so far, newest in the middle">
      <div class="roll" id="roll" aria-live="polite"></div>
    </section>

    <section class="left">
      <div class="axes">
        <canvas id="ax" aria-label="Three alphabet axes, one per letter, each looping from z back to a. The path of clicks from your letters to the closest word is drawn across them."></canvas>
      </div>
      <p class="cap">The clicks: one axis per letter, z loops back to a</p>
    </section>

    <section class="right">
      <div class="boxes">
        <figure>
          <div class="boxwrap"><canvas class="box" id="boxIn" aria-label="A first-person view from your three letters: the three letter axes run out to the horizon, nearby words stand around you, and the path of clicks leads to the closest word"></canvas></div>
          <figcaption id="capIn">Where you stand</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <div class="foot">
    <button class="textbtn" id="fresh" type="button">New sheet</button>
    <button class="textbtn" id="sound" type="button" aria-pressed="true">Sound on</button>
    <span class="hint">Drag the view to look around</span>
  </div>

<script>
(() => {
  /* The dictionary: common three-letter words, most common first.
     Common words win ties. */
  const WORDS = 'the and for you not are all new can but our one may out use any see his who web now get how its top day two buy her add she set map way off car own end him big law art old why low man job too men box air yes hot say tax got let act red key few age pay war fax yet sun run net put try god log fun lot ask due mar pro ago via bad far oil bit bay bar dog gas six sat zip bid wed inn win bed sea cut kit boy son bin van ads pop hit eye fee aid fat saw sub led fan ten cat die pet guy cup fit met ice bus bag nor bug mid lab tag mix fix ray dry spa ups won doc mom row eat aim tip ski fly hey tea sky toy hip dot cap ink pin raw gnu hat wet ram fox arm pub hop gun ref kid pan sum oak vat sir spy sit wow fig tab sin leg jay gap rob era asp jet par mad pen joy ran ill lay bet dad pat ear tie rep toe den lie amp eve pad rod sad pot egg rev jam arc app ion fed ban odd cry zoo tee cad hub ace sue chi ins opt flu rap tin rat cod gel thy pal mat gym tan pie bow cab dam tub ash tap bee pit ton bra cow doe rid rip sol bat lip sap aye dig rim pig lit duo fog yea fur tar rug ham jar wax nut bye lap ant apt gem gig ate fin mud dip yen lid hay nil cop dim sip wan pod wit mug owl din vet gal tot elk soy bud dye dew gum fry lea huh shy hex err rue elf dub ivy ark goo cue sac peg mum hen ego nay cur mob gag sis ale hut rub gov imp wee owe ore nip hum pep gut yep bur elm hug boo tow adj rig sax jaw lag axe rib woo nib eta beg lei roe nap vie ape gee rag lob yum kin fir hog rum orb awe cub lug bib tam hid nod wig ohm rye lad lax pea hem rot emu paw dab gin tic mop urn ply cot ire tad sew fob bop boa aft dun ode moo yup ado ail bog bun caw cob cog coo coy dud ebb eel eke eon ewe fad fen fez fib foe fro gab gob hah hew hoe hue icy ilk irk jab jig jog jot jug jut keg lop lye mew mow nab nag nee nit nun oaf oar pew pry pun pup rut sag sly sob sod sop sow tug ugh vex vow wad wag wiz woe wok wry yak yam yap yew aha baa oat pox tux zap zit'.split(' ');
  const SET = new Set(WORDS);
  // Letters the machine will not stamp. Stored as ROT13.
  const rot = w => w.replace(/[a-z]/g, c => String.fromCharCode((c.charCodeAt(0) - 84) % 26 + 97));
  const BLOCK = new Set('nff snt stg phz xhz gvg frk shx shd spx shp xxx avt atn wvm wmm qpx qvx pbx pag jgs snc kkk xlf xzf fzq wnc jbc tlc ubr'.split(' ').map(rot));
  const N = 3, A = 'abcdefghijklmnopqrstuvwxyz', TAU = Math.PI * 2;
  const idx = w => [...w].map(c => c.charCodeAt(0) - 97);
  const word = v => v.map(i => A[i]).join('');
  const mod = i => ((i % 26) + 26) % 26;
  // Each axis loops, so z sits next to a. The offset is the short way round, from -13 to 12.
  const off = (a, b) => mod(b - a + 13) - 13;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const bands = [...document.querySelectorAll('.band')];
  const strips = bands.map(b => b.querySelector('.strip'));
  const bandsEl = document.getElementById('bands');
  const prompt = document.getElementById('prompt');
  const stampEl = document.getElementById('stamp');
  const typer = document.getElementById('typer');
  const go = document.getElementById('go');
  const lastEl = document.getElementById('last');
  const capIn = document.getElementById('capIn');

  let typed = '', busy = false, showing = false;
  let from = null, cur = null, to = null, head = -1, reach = -1;
  let ties = [], best = null;
  let path = [], busyMsg = '';

  /* ---------- sound: synthesized, nothing loaded ---------- */
  let ac = null, noise = null, soundOn = true;
  try { soundOn = localStorage.getItem('tcw-sound') !== 'off'; } catch (e) {}
  const soundBtn = document.getElementById('sound');
  function paintSound() { soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off'; soundBtn.setAttribute('aria-pressed', String(soundOn)); }
  paintSound();
  soundBtn.addEventListener('click', () => {
    soundOn = !soundOn; paintSound();
    try { localStorage.setItem('tcw-sound', soundOn ? 'on' : 'off'); } catch (e) {}
  });
  function audio() {
    if (!soundOn) return null;
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        noise = ac.createBuffer(1, ac.sampleRate * 0.08, ac.sampleRate);
        const d = noise.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      } catch (e) { soundOn = false; return null; }
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function burst(freq, q, vol, len, type) {
    const a = audio(); if (!a) return;
    const t = a.currentTime, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = noise; f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    src.connect(f).connect(g).connect(a.destination); src.start(t); src.stop(t + len + 0.02);
  }
  function thump(freq, vol, len) {
    const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.5, t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + len + 0.02);
  }
  const sKey = () => { burst(1800 + Math.random() * 1400, 1.2, 0.5, 0.05); thump(140, 0.25, 0.05); };
  const sSpace = () => burst(900, 0.8, 0.22, 0.05);
  const sTick = () => burst(5200, 2, 0.16, 0.018, 'highpass');

      const w = c.measureText(text).width, hgt = parseFloat(font.match(/(\d+(\.\d+)?)px/)[1]);
      for (const [ox, oy] of only ? [[dx, dy]] : [[dx, dy], [-dx - w, dy], [dx, -dy], [-dx - w, -dy]]) {
        const X = x + ox, Y = y + oy, rr = [X - 2, Y - hgt * 0.6, X + w + 2, Y + hgt * 0.6];
        if (taken.some(t => rr[0] < t[2] && rr[2] > t[0] && rr[1] < t[3] && rr[3] > t[1])) continue;
        taken.push(rr); c.fillText(text, X, Y); return;
      }
    };
    c.textAlign = 'left';
    const size = s => Math.max(11, Math.min(26, F / s[2] * 0.16));
    const winMark = best && marks.find(m => m.p.w === best.w);
    if (winMark) { c.fillStyle = '#111'; place(best.w, winMark.s[0], winMark.s[1], `700 ${size(winMark.s) * 1.15}px ${TYPEFACE}`, 9, -9); }
    if (O) {
      c.lineWidth = 1.8; c.fillStyle = '#fff'; c.strokeStyle = '#111';
      c.beginPath(); c.arc(O[0], O[1], 6, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = '#111'; place(word(here), O[0], O[1], `700 ${size(O)}px ${TYPEFACE}`, 10, 14);
    }
    for (const { p, s } of marks.slice().reverse()) {
      if (!named.has(p.w) || (best && p.w === best.w)) continue;
      c.fillStyle = '#6a6a6a';
      place(p.w, s[0], s[1], `${size(s)}px ${TYPEFACE}`, 7, -7);
    }
    // then the letters along the axes, only where they do not cover a word
    for (const [ch, x, y, sz] of ticks) {
      c.fillStyle = `rgba(0,0,0,${Math.min(0.55, 0.15 + sz / 40)})`;
      place(ch, x, y, MONO(sz), 0, 0, true);
    }
    // the axis names go last, wherever there is room
    for (let k = 0; k < 3; k++) {
      const nm = [0, 0, 0]; nm[k] = 2.6;
      const s = at(nm); if (!s) continue;
      c.fillStyle = '#b0b0b0';
      place(['1st', '2nd', '3rd'][k], s[0], s[1], MONO(Math.max(9, Math.min(13, F / s[2] * 0.11))), -26, 12);
    }
  }

  // Drag to look around.
  let drag = null;
  view.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; view.classList.add('dragging'); yawGoal = pitchGoal = null; });
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    yaw -= (e.clientX - drag.x) * 0.006;
    if (e.pointerType === 'mouse') pitch = Math.max(-0.9, Math.min(0.9, pitch - (e.clientY - drag.y) * 0.004));
    drag.x = e.clientX; drag.y = e.clientY;
  });
  const endDrag = () => { view.classList.remove('dragging'); drag = null; };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const k = still ? 1 : Math.min(1, dt * 2.2);
    if (yawGoal !== null) {
      const d = Math.atan2(Math.sin(yawGoal - yaw), Math.cos(yawGoal - yaw));
      yaw += d * k; if (Math.abs(d) < 1e-3) yawGoal = null;
    }
    if (pitchGoal !== null) { pitch += (pitchGoal - pitch) * k; if (Math.abs(pitchGoal - pitch) < 1e-3) pitchGoal = null; }
    drawAxes();
    drawView();
    requestAnimationFrame(frame);
  }

  paintBands();
  requestAnimationFrame(frame);
  intro();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>moonflower — from home 2 the frontier</title>
<style>
  /* ---------------------------------------------------------------
     moonflower — standalone pitch page, v8 / mobile recomposed
     Portrait now runs the same composition as landscape: lighthouse on
     the left, beam crossing behind the bouquet in the middle, notes on
     the right. It fits because the notes break onto shorter lines in
     portrait — the words stay the same size, the column just gets
     narrower.
     Self-contained: no external fonts, scripts, images or stylesheets.
     Delete this file and nothing else on the site is affected.
     --------------------------------------------------------------- */

  :root{
    --black:#000000;
    --violet:#7B2BF5;
    --ink:#FFFFFF;
    --bloom-red:#E01B24;
    --bloom-red-hot:#FF4D5A;
    --magenta:#FF1B8D;
    --stem-green:#00C853;
    --stem-green-deep:#00A651;
    --earth-blue:#1565D8;
    --earth-green:#00A651;

    --marker:"Marker Felt","Chalkboard SE","Comic Sans MS","Segoe Print",cursive;
    --hand:"Bradley Hand","Chalkboard SE","Segoe Print","Comic Sans MS",cursive;
  }

  *{box-sizing:border-box;}

  html{background:var(--black);}

  body{
    margin:0;
    background:var(--black);
    color:var(--ink);
    font-family:var(--hand);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* --- scroll stage -------------------------------------------------
     dvh keeps the pinned panel steady while a mobile address bar
     collapses; vh is the fallback for browsers without dvh support. */

  .stage{height:230vh;height:230dvh;position:relative;}

  .pinned{
    position:sticky;
    top:0;
    height:100vh;
    height:100dvh;
    width:100%;
    overflow:hidden;
  }

  .hero{position:absolute;inset:0;will-change:opacity,transform;}
  .hero svg{display:block;width:100%;height:100%;touch-action:pan-y;}

  /* --- type inside the artwork (sizes are set per layout in JS) ---- */

  .t-title{font-family:var(--marker);fill:var(--violet);}
  .t-tagline{font-family:var(--marker);fill:var(--violet);letter-spacing:1px;}
  .t-note{font-family:var(--hand);fill:var(--ink);letter-spacing:1px;}

  /* home -> the practice, frontier -> linkedin.
     No mark of any kind: the two words glow between the title violet and
     a paler one, both on the same slow cycle so they flash together. */
  .t-tagline a{cursor:pointer;}
  .t-tagline a tspan{
    text-decoration:none;
    filter:drop-shadow(0 0 3px rgba(155,91,255,.35));
    animation:linkBreatheFill 5s ease-in-out infinite;
    transition:fill .2s ease,filter .2s ease;
  }
  /* second word runs a quarter cycle behind — close enough to feel
     linked, offset enough that they never flash together */
  .t-tagline a:nth-of-type(2) tspan{animation-delay:-1.25s;}
  .t-tagline a:hover tspan{
    animation:none;
    fill:#E4D2FF;
    filter:drop-shadow(0 0 10px rgba(190,150,255,.75));
  }

  @keyframes linkBreatheFill{
    0%,100%{fill:var(--violet);filter:drop-shadow(0 0 2px rgba(155,91,255,.22));}
    42%    {fill:#C9A6FF;      filter:drop-shadow(0 0 9px rgba(190,150,255,.58));}
    56%    {fill:#C9A6FF;      filter:drop-shadow(0 0 9px rgba(190,150,255,.58));}
  }
  @keyframes linkBreatheColor{
    0%,100%{color:var(--violet);text-shadow:0 0 3px rgba(155,91,255,.22);}
    42%    {color:#C9A6FF;      text-shadow:0 0 11px rgba(190,150,255,.58);}
    56%    {color:#C9A6FF;      text-shadow:0 0 11px rgba(190,150,255,.58);}
  }

  /* --- the reveal ------------------------------------------------- */

  .idea{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    text-align:center;
    padding:5vh 8vw;
    opacity:0;
    pointer-events:none;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    will-change:opacity,transform;
  }

  /* margin:auto centres the block but still lets it scroll if the
     screen is too short — justify-content:center would clip the top */
  .idea-inner{margin:auto;width:100%;max-width:62ch;}

  .idea h2{
    font-family:var(--marker);
    font-size:clamp(44px,9vw,116px);
    color:var(--violet);
    margin:0;
    letter-spacing:4px;
    font-weight:400;
  }

  .idea-body{
    margin-top:2rem;
    font-family:var(--hand);
    font-size:clamp(16px,1.9vw,24px);
    line-height:1.7;
    color:#FFFFFF;
  }

  .idea-body p{margin:0 0 1.15em;}
  .idea-body p:last-child{margin-bottom:0;}

  /* the earth and the moon, tipping */
  .seesaw{
    display:block;
    width:clamp(210px,44vw,360px);
    margin:2.1rem auto 0;
    overflow:visible;
  }
  .seesaw .beam{
    transform-box:view-box;
    transform-origin:200px 88px;
    animation:tilt 5.2s ease-in-out infinite;
  }
  @keyframes tilt{
    0%,100%{transform:rotate(-11deg);}
    50%    {transform:rotate(11deg);}
  }

  /* the two bodies roll in place as the plank tips — the moon is the
     smaller of the two, so it turns further over the same arc */
  .seesaw .roll-earth,
  .seesaw .roll-moon{transform-box:view-box;}
  .seesaw .roll-earth{
    transform-origin:104px 65px;
    animation:rollEarth 5.2s ease-in-out infinite;
  }
  .seesaw .roll-moon{
    transform-origin:298px 70px;
    animation:rollMoon 5.2s ease-in-out infinite;
  }
  @keyframes rollEarth{
    0%,100%{transform:rotate(-19deg);}
    50%    {transform:rotate(19deg);}
  }
  @keyframes rollMoon{
    0%,100%{transform:rotate(-24deg);}
    50%    {transform:rotate(24deg);}
  }

  /* ---- the flower's routine --------------------------------------
     Three nested groups on one 14s clock: the arc it travels (translate),
     the tumble (rotate about its middle), and the sprouting (scale from
     its base). The rotation runs to -720deg across two flips, a whole
     number of turns, so the loop never snaps. */

  .walker      {animation:flipPath 14s ease-in-out infinite;}
  .walker-spin {animation:flipSpin 14s ease-in-out infinite;}
  .walker-body {animation:flipSprout 14s ease-in-out infinite;}
  .f-arms      {animation:armTuck 14s ease-in-out infinite;}
  .f-legs      {animation:legTuck 14s ease-in-out infinite;}

  .walker-spin{transform-box:fill-box;transform-origin:center;}
  .walker-body{transform-box:fill-box;transform-origin:bottom center;}
  /* the shoulders and the hips are the top-centre of each limb group's
     own box, which is exactly where they should pivot from */
  .f-arms,.f-legs{transform-box:fill-box;transform-origin:top center;}

  @keyframes flipPath{
    0%,20%  {transform:translate(60px,121px);}   /* clear of the seesaw */
    23%     {transform:translate(88px,95px);}
    26%     {transform:translate(116px,72px);}
    28%     {transform:translate(137px,58px);}
    30%     {transform:translate(158px,58px);}
    32%     {transform:translate(180px,70px);}
    34%,52% {transform:translate(200px,88px);}   /* the pivot */
    55%     {transform:translate(228px,68px);}
    58%     {transform:translate(256px,56px);}
    60%     {transform:translate(277px,54px);}
    62%     {transform:translate(299px,62px);}
    64%     {transform:translate(322px,84px);}
    65%     {transform:translate(334px,100px);}
    66%,100%{transform:translate(345px,121px);}  /* clear on the right */
  }

  /* the small wind-back before each flip is what makes it read as
     a jump rather than a spin */
  @keyframes flipSpin{
    0%,18%  {transform:rotate(0deg);}
    20%     {transform:rotate(14deg);}
    34%,52% {transform:rotate(-360deg);}
    54%     {transform:rotate(-346deg);}
    66%,100%{transform:rotate(-720deg);}
  }

  @keyframes armTuck{
    0%,18%  {transform:none;}
    21%     {transform:rotate(-20deg) scale(.92);}
    24%     {transform:scale(.6,.5) rotate(22deg);}
    32%     {transform:scale(.6,.5) rotate(22deg);}
    35%,50% {transform:none;}
    53%     {transform:rotate(-20deg) scale(.92);}
    56%     {transform:scale(.6,.5) rotate(22deg);}
    64%     {transform:scale(.6,.5) rotate(22deg);}
    67%,100%{transform:none;}
  }

  @keyframes legTuck{
    0%,18%  {transform:none;}
    20%     {transform:scaleY(.72);}          /* crouch */
    24%     {transform:scale(.7,.42);}        /* knees up */
    32%     {transform:scale(.7,.42);}
    35%     {transform:scaleY(.82);}          /* absorb the landing */
    38%,50% {transform:none;}
    52%     {transform:scaleY(.72);}
    56%     {transform:scale(.7,.42);}
    64%     {transform:scale(.7,.42);}
    67%     {transform:scaleY(.82);}
    70%,100%{transform:none;}
  }

  @keyframes flipSprout{
    0%      {transform:scale(.08,.02);opacity:0;}
    3%      {opacity:1;}
    12%     {transform:scale(1,1);opacity:1;}
    84%     {transform:scale(1,1);opacity:1;}
    96%     {transform:scale(.08,.02);opacity:0;}
    100%    {transform:scale(.08,.02);opacity:0;}
  }

  /* closing lines, in the violet of the title */
  .signoff{
    margin-top:2.4rem;
    font-family:var(--marker);
    color:var(--violet);
    line-height:1.35;
  }
  .signoff .tag{font-size:clamp(19px,2.3vw,30px);letter-spacing:1px;}
  .signoff a{
    color:var(--violet);
    text-decoration:none;
    text-shadow:0 0 4px rgba(155,91,255,.3);
    animation:linkBreatheColor 5s ease-in-out infinite;
    transition:color .2s ease,text-shadow .2s ease;
  }
  .signoff a:nth-of-type(2){animation-delay:-1.25s;}
  .signoff a:hover{
    animation:none;
    color:#E4D2FF;
    text-shadow:0 0 12px rgba(190,150,255,.7);
  }
  .signoff .name{
    display:block;
    margin-top:.3em;
    font-size:clamp(30px,4.4vw,58px);
    letter-spacing:3px;
  }

  /* each block eases in a beat after the one before */
  .idea-body p,.seesaw,.signoff{
    opacity:0;
    transform:translateY(14px);
    transition:opacity .7s ease,transform .7s ease;
  }
  .idea.revealed .idea-body p,
  .idea.revealed .seesaw,
  .idea.revealed .signoff{opacity:1;transform:none;}
  .idea.revealed .idea-body p{transition-delay:.06s;}
  .idea.revealed .seesaw{transition-delay:.24s;}
  .idea.revealed .signoff{transition-delay:.44s;}

  /* only the shortest screens need trimming now */
  @media (max-height:620px){
    .idea h2{font-size:clamp(32px,6.6vw,66px);}
    .idea-body{margin-top:1.2rem;font-size:16px;line-height:1.6;}
    .signoff{margin-top:1.5rem;}
  }

  /* --- scroll cue -------------------------------------------------- */

  .cue{
    position:absolute;
    left:50%;
    bottom:max(3.2vh,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    font-family:var(--hand);
    font-size:15px;
    letter-spacing:.32em;
    color:rgba(255,255,255,.45);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.55rem;
    pointer-events:none;
  }

  .cue i{
    display:block;
    width:9px;height:9px;
    border-right:1.5px solid rgba(255,255,255,.45);
    border-bottom:1.5px solid rgba(255,255,255,.45);
    transform:rotate(45deg);
    animation:nudge 2.4s ease-in-out infinite;
  }

  @keyframes nudge{
    0%,100%{transform:rotate(45deg) translate(0,0);opacity:.35;}
    50%    {transform:rotate(45deg) translate(3px,3px);opacity:.9;}
  }

  /* --- ambient motion ---------------------------------------------- */

  .node-wrap{animation:nodePulse 4.6s ease-in-out infinite;}
  @keyframes nodePulse{0%,100%{opacity:.66;}50%{opacity:1;}}

  .ray{animation:rayShimmer 6.2s ease-in-out infinite;}
  @keyframes rayShimmer{0%,100%{opacity:.5;}50%{opacity:1;}}

  /* the calyx breathes very slightly, like a plant settling */
  .leaf{animation:leafSway 9s ease-in-out infinite;transform-box:fill-box;}
  @keyframes leafSway{
    0%,100%{transform:rotate(-0.5deg) translateY(0);}
    50%    {transform:rotate(0.6deg) translateY(-1.5px);}
  }

  .drift-a{animation:drift 26s linear infinite alternate;}
  .drift-b{animation:drift 34s linear infinite alternate;}
  .drift-c{animation:drift 44s linear infinite alternate;}
  @keyframes drift{from{transform:translateX(0);}to{transform:translateX(34px);}}

  .twinkle{animation:twinkle 5.5s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.22;}50%{opacity:.85;}}

  .grain{animation:grain 7.5s ease-in-out infinite;}
  @keyframes grain{0%,100%{opacity:.12;}50%{opacity:.6;}}

  .glint{animation:glint 4.4s ease-in-out infinite;}
  @keyframes glint{
    0%,100%{opacity:.08;transform:scale(.55);}
    45%    {opacity:.95;transform:scale(1.15);}
    62%    {opacity:.35;transform:scale(.85);}
  }

  .rimlight{animation:rimlight 11s ease-in-out infinite;}
  @keyframes rimlight{0%,100%{opacity:.16;}50%{opacity:.42;}}

  .beacon{animation:beacon 3.8s ease-in-out infinite;}
  @keyframes beacon{0%,100%{opacity:.55;}50%{opacity:1;}}

  @media (prefers-reduced-motion: reduce){
    .node-wrap,.ray,.leaf,.drift-a,.drift-b,.drift-c,.twinkle,.grain,
    .glint,.rimlight,.beacon,.cue i{animation:none !important;}
    .node-wrap{opacity:.9;}
    .ray{opacity:.8;}
    .glint{opacity:.7;}
    .idea-body p,.seesaw,.signoff{transition:none;opacity:1;transform:none;}
    .t-tagline a tspan{animation:none;fill:#C9A6FF;}
    .signoff a{animation:none;color:#C9A6FF;}
    .seesaw .beam{animation:none;transform:rotate(-6deg);}
    .seesaw .roll-earth,.seesaw .roll-moon{animation:none;transform:rotate(-9deg);}
    .walker,.walker-spin,.walker-body,.f-arms,.f-legs{animation:none;}
    .walker{transform:translate(200px,88px);}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="pinned">

    <div class="hero" id="hero">
      <svg id="scene" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"
           aria-label="A bouquet of flowers dissolving into a node graph, growing from the cratered surface of the moon, with the earth and a lighthouse alongside.">
        <defs>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="softer" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="11" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="haze" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="22"/>
          </filter>
          <!-- bottom-to-top: the stem's white melting through green into the red -->
          <linearGradient id="g-blend" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0"    stop-color="#FFFFFF"/>
            <stop offset="0.26" stop-color="#00C853"/>
            <stop offset="0.70" stop-color="#00C853"/>
            <stop offset="1"    stop-color="#E01B24"/>
          </linearGradient>
        </defs>

        <!-- painted back-to-front -->
        <g id="dust"></g>
        <g id="moon"></g>
        <g id="beam"></g>
        <g id="stems"></g>
        <g id="bouquet"></g>
        <g id="earth"></g>
        <g id="type"></g>
      </svg>
    </div>

    <div class="idea" id="idea">
      <div class="idea-inner">
        <h2>the idea</h2>
        <div class="idea-body">
          <p>We leverage our data and knowledge of farming on Earth using mathematical structures to create farming solutions for the moon and difficult terrains on Earth.</p>
        </div>
        <svg class="seesaw" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg"
             aria-label="The earth and the moon balanced on a seesaw, tipping slowly back and forth.">
          <!-- ground -->
          <path d="M 24 122 C 90 118 170 117 200 118 C 250 119 330 119 376 123"
                fill="none" stroke="#FFFFFF"
                stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M 40 126 C 110 122 180 121 214 122 C 268 123 332 123 362 127"
                fill="none" stroke="#FFFFFF"
                stroke-opacity=".2" stroke-width="1.1" stroke-linecap="round"/>

          <!-- fulcrum, drawn twice so the edge chatters -->
          <path d="M 184 120 L 200 89 L 216 120" fill="none" stroke="#FFFFFF"
                stroke-opacity=".7" stroke-width="2" stroke-linejoin="round"/>
          <path d="M 187 121 L 201 93 L 213 120" fill="none" stroke="#FFFFFF"
                stroke-opacity=".28" stroke-width="1.2" stroke-linejoin="round"/>

          <g class="beam">
            <path d="M 84 88 L 316 88" fill="none" stroke="#FFFFFF"
                  stroke-opacity=".85" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M 87 85 L 313 86" fill="none" stroke="#FFFFFF"
                  stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/>

            <!-- earth: the body rolls, the contact mark stays put -->
            <g class="roll-earth">
              <circle cx="104" cy="65" r="21" fill="none" stroke="#1565D8" stroke-width="2.6"/>
              <circle cx="104" cy="65" r="21.8" fill="none" stroke="#1565D8"
                      stroke-opacity=".35" stroke-width="1.1"/>
              <path d="M 92 54 C 97 47 105 50 107 55 C 110 49 117 52 115 58 C 118 63 115 69 110 71
                       C 108 76 98 78 94 73 C 88 74 84 68 87 62 C 84 58 87 54 92 54 Z"
                    fill="none" stroke="#00A651" stroke-width="2" stroke-linejoin="round"/>
            </g>
            <path d="M 97 83 L 104 87 L 111 83" fill="none" stroke="#FFFFFF"
                  stroke-opacity=".35" stroke-width="1.2" stroke-linecap="round"/>

            <!-- moon: craters ride round with it, so the roll reads -->
            <g class="roll-moon">
              <circle cx="298" cy="70" r="17" fill="none" stroke="#FFFFFF"
                      stroke-opacity=".8" stroke-width="2.2"/>
              <circle cx="298" cy="70" r="17.7" fill="none" stroke="#FFFFFF"
                      stroke-opacity=".25" stroke-width="1"/>
              <ellipse cx="292" cy="64" rx="4.6" ry="3.4" fill="none" stroke="#FFFFFF"
                       stroke-opacity=".5" stroke-width="1.1"/>
              <ellipse cx="303" cy="73" rx="3.4" ry="2.5" fill="none" stroke="#FFFFFF"
                       stroke-opacity=".42" stroke-width="1"/>
              <ellipse cx="295" cy="77.5" rx="2.4" ry="1.8" fill="none" stroke="#FFFFFF"
                       stroke-opacity=".35" stroke-width=".9"/>
            </g>
            <path d="M 292 84 L 298 87 L 304 84" fill="none" stroke="#FFFFFF"
                  stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/>
          </g>

          <!-- the acrobat: a face in the bloom, arms off the stem, legs
               it stands on. drawn with its feet at the origin, then flown
               around by the animation -->
          <g class="walker">
            <g class="walker-spin">
              <g class="walker-body">

                <g class="f-legs">
                  <path d="M 0 -9 Q -2.6 -5 -3.6 -0.6" fill="none" stroke="#FFFFFF"
                        stroke-opacity=".9" stroke-width="1.4" stroke-linecap="round"/>
                  <path d="M 0 -9 Q 2.6 -5 3.6 -0.6" fill="none" stroke="#FFFFFF"
                        stroke-opacity=".9" stroke-width="1.4" stroke-linecap="round"/>
                  <path d="M -5 0 L -2.4 -0.6" fill="none" stroke="#FFFFFF"
                        stroke-opacity=".85" stroke-width="1.3" stroke-linecap="round"/>
                  <path d="M 2.4 -0.6 L 5 0" fill="none" stroke="#FFFFFF"
                        stroke-opacity=".85" stroke-width="1.3" stroke-linecap="round"/>
                </g>

                <!-- torso, doubled for the sketched edge -->
                <path d="M 0 -9 C -1.4 -12, 1.4 -15, 0 -18" fill="none" stroke="#FFFFFF"
                      stroke-opacity=".9" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M 0.4 -9.5 C -0.8 -12, 1.8 -15, 0.4 -17.6" fill="none"
                      stroke="#FFFFFF" stroke-opacity=".3" stroke-width=".8"
                      stroke-linecap="round"/>

                <g class="f-arms">
                  <path d="M 0 -16 Q -4.6 -14.6 -6.8 -11.4" fill="none" stroke="#FFFFFF"
                        stroke-opacity=".88" stroke-width="1.3" stroke-linecap="round"/>
                  <path d="M 0 -16 Q 4.6 -14.6 6.8 -11.4" fill="none" stroke="#FFFFFF"
                        stroke-opacity=".88" stroke-width="1.3" stroke-linecap="round"/>
                </g>

                <!-- green neck -->
                <path d="M 0 -17 Q -1.8 -19.4 -2.2 -21.6" fill="none" stroke="#00C853"
                      stroke-opacity=".9" stroke-width="1.3" stroke-linecap="round"/>
                <path d="M 0 -17 Q 1.8 -19.4 2.2 -21.6" fill="none" stroke="#00C853"
                      stroke-opacity=".9" stroke-width="1.3" stroke-linecap="round"/>
                <path d="M 0 -17.6 Q 0.3 -19.6 0 -21.8" fill="none" stroke="#00A651"
                      stroke-opacity=".8" stroke-width="1.1" stroke-linecap="round"/>

                <!-- head -->
                <path d="M 0 -25 Q -0.8 -28.4 0 -31" fill="none" stroke="#E01B24"
                      stroke-width="1.5" stroke-linecap="round"/>
                <path d="M 0 -25 Q -2.2 -28 -3 -30.2" fill="none" stroke="#E01B24"
                      stroke-width="1.4" stroke-linecap="round"/>
                <path d="M 0 -25 Q 2.2 -28 3 -30.2" fill="none" stroke="#E01B24"
                      stroke-width="1.4" stroke-linecap="round"/>
                <path d="M 0 -25 Q -3.8 -27 -5.2 -28" fill="none" stroke="#FF1B8D"
                      stroke-width="1.3" stroke-linecap="round"/>
                <path d="M 0 -25 Q 3.8 -27 5.2 -28" fill="none" stroke="#E01B24"
                      stroke-width="1.3" stroke-linecap="round"/>
                <path d="M 0 -25 Q -4.4 -24.4 -6 -25" fill="none" stroke="#E01B24"
                      stroke-width="1.2" stroke-linecap="round"/>
                <path d="M 0 -25 Q 4.4 -24.4 6 -25" fill="none" stroke="#FF1B8D"
                      stroke-width="1.2" stroke-linecap="round"/>
                <path d="M 0 -25 Q -4 -22.8 -5.2 -22" fill="none" stroke="#E01B24"
                      stroke-width="1.2" stroke-linecap="round"/>
                <path d="M 0 -25 Q 4 -22.8 5.2 -22" fill="none" stroke="#E01B24"
                      stroke-width="1.2" stroke-linecap="round"/>

                <!-- face -->
                <circle cx="-1.7" cy="-25.8" r=".85" fill="#FFFFFF"/>
                <circle cx="1.7" cy="-25.8" r=".85" fill="#FFFFFF"/>
                <path d="M -2 -23.6 Q 0 -22.2 2 -23.6" fill="none" stroke="#FFFFFF"
                      stroke-opacity=".85" stroke-width=".7" stroke-linecap="round"/>

              </g>
            </g>
          </g>
        </svg>

        <div class="signoff">

<script>
(function(){
  "use strict";

  var NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("scene");

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var coarse  = window.matchMedia("(pointer: coarse)").matches;
  var canHover = window.matchMedia("(hover: hover)").matches;

  var LOWFX = coarse || Math.min(window.innerWidth, window.innerHeight) < 620;
  function fx(id){ return LOWFX ? null : "url(#" + id + ")"; }

  function el(name, attrs, parent){
    var n = document.createElementNS(NS, name);
    for(var k in attrs){ if(attrs[k] !== null) n.setAttribute(k, attrs[k]); }
    if(parent) parent.appendChild(n);
    return n;
  }
  function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }

  function seeded(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  var G = {
    dust:    document.getElementById("dust"),
    moon:    document.getElementById("moon"),
    beam:    document.getElementById("beam"),
    stems:   document.getElementById("stems"),
    bouquet: document.getElementById("bouquet"),
    earth:   document.getElementById("earth"),
    type:    document.getElementById("type")
  };

  /* ============================================================
     LAYOUTS
     ============================================================ */

  var LAYOUTS = {

    landscape: {
      viewBox: "0 0 1600 1000", w: 1600, h: 1000,
      title:   { x: 800, y: 128, size: 128, track: 6 },
      tagline: { x: 800, y: 218, size: 58 },
      notes:   { x: 1178, blocks: [430, 572], size: 42, lead: 54, anchor: "start" },
      copy:  [["making flowers", "for the moon"], ["using flowers", "from home"]],
      earth:   { s: 1, tx: 0, ty: 0 },
      beamEnd: { x: 1168, y: 514 },
      blooms: [
        { x: 668, y: 396, r: 66, dissolve: 0.10, seed: 1201 },
        { x: 800, y: 336, r: 80, dissolve: 0.55, seed: 2402 },
        { x: 936, y: 400, r: 66, dissolve: 1.00, seed: 3603 }
      ],
      stemBase: { x: 800, y: 662 },
      dome:  { cx: 800, apex: 628, k: 0.00053, ground: 1160 },
      count: { mare: 5, streak: 34, rille: 11, crater: 64, ridge: 7,
               grain: 1100, glint: 54, star: 9, dust: 130, beam: 320 }
    },

    /* Same reading order as landscape — earth, then flowers, then the
       notes — squeezed into a phone by breaking the notes onto four short
       lines instead of two long ones. The words keep their size; only the
       column narrows. The lighthouse, the bouquet and the notes are then
       set at the heights that put the beam just under the flower heads
       and well clear of the braid, the way it reads in landscape. */
    portrait: {
      viewBox: "0 0 820 1680", w: 820, h: 1680,
      title:   { x: 410, y: 132, size: 88, track: 3 },
      tagline: { x: 410, y: 212, size: 40 },
      notes:   { x: 600, blocks: [400, 633], size: 40, lead: 44, anchor: "start" },
      copy:  [["making", "flowers", "for the", "moon"],
              ["using", "flowers", "from", "home"]],
      earth:   { s: 0.62, tx: -70.8, ty: 290 },
      beamEnd: { x: 590, y: 568 },
      blooms: [
        { x: 330, y: 370, r: 44, dissolve: 0.10, seed: 1201 },
        { x: 392, y: 330, r: 52, dissolve: 0.55, seed: 2402 },
        { x: 452, y: 372, r: 44, dissolve: 1.00, seed: 3603 }
      ],
      stemBase: { x: 390, y: 883 },
      dome:  { cx: 410, apex: 880, k: 0.00371, ground: 1700 },
      count: { mare: 4, streak: 22, rille: 8, crater: 34, ridge: 5,
               grain: 480, glint: 26, star: 5, dust: 90, beam: 200 }
    }
  };

  var L = null;
  var liveNodes = [];
  var liveRays  = [];
  var SW = 1;                 /* stroke weight factor per layout */

  /* where the white braid hands over to the green */
  function calyxBase(b){ return { x: b.x, y: b.y + b.r * 0.62 }; }

  function domeY(x){ var d = x - L.dome.cx; return L.dome.apex + L.dome.k * d * d; }
  function surfaceY(x, depth){ var h = domeY(x); return h + depth * (L.dome.ground - h); }
  function squash(depth){ return 0.13 + depth * 0.60; }

  function domePath(){
    var d = "", first = true;
    for(var x = -90; x <= L.w + 90; x += 16){
      var y = domeY(x);
      if(y > L.dome.ground + 160) continue;
      d += (first ? "M " : " L ") + x.toFixed(1) + " " + y.toFixed(1);
      first = false;
    }
    return d;
  }

  /* ---- cubic helpers, used by the calyx ----------------------- */
  function cubicAt(P0, C1, C2, P3, t){
    var m = 1 - t;
    return [ m*m*m*P0[0] + 3*m*m*t*C1[0] + 3*m*t*t*C2[0] + t*t*t*P3[0],
             m*m*m*P0[1] + 3*m*m*t*C1[1] + 3*m*t*t*C2[1] + t*t*t*P3[1] ];
  }
  function cubicTan(P0, C1, C2, P3, t){
    var m = 1 - t;
    var x = 3*m*m*(C1[0]-P0[0]) + 6*m*t*(C2[0]-C1[0]) + 3*t*t*(P3[0]-C2[0]);
    var y = 3*m*m*(C1[1]-P0[1]) + 6*m*t*(C2[1]-C1[1]) + 3*t*t*(P3[1]-C2[1]);
    var L2 = Math.sqrt(x*x + y*y) || 1;
    return [x/L2, y/L2];
  }

  /* ============================================================
     1. MOON
     ============================================================ */
  function drawMoon(){
    var g = G.moon, r = seeded(1907), N = L.count;

    var lMare = el("g",{},g), lStreak = el("g",{},g), lRille = el("g",{},g),
        lCrater = el("g",{},g), lRidge = el("g",{},g), lGrain = el("g",{},g),
        lGlint = el("g",{},g), lRim = el("g",{},g);

    for(var m = 0; m < N.mare; m++){
      var mx = L.w * (0.1 + m * (0.8 / N.mare)) + (r() - 0.5) * L.w * 0.1;
      var md = 0.16 + r() * 0.62;
      var my = surfaceY(mx, md);
      var mw = L.w * (0.12 + r() * 0.16);
      var mh = mw * squash(md) * 0.9;
      var d = "M " + (mx - mw).toFixed(0) + " " + my.toFixed(0);
      for(var s = 1; s <= 7; s++){
        var ang = Math.PI * (s / 7), wob = 0.78 + r() * 0.44;
        d += " Q " + (mx - mw * Math.cos(ang - 0.22) * wob).toFixed(0) + " " +
             (my - mh * Math.sin(ang) * wob).toFixed(0) + " " +
             (mx - mw * Math.cos(ang) * wob).toFixed(0) + " " +
             (my - mh * Math.sin(ang) * 0.2).toFixed(0);
      }
      for(var s2 = 1; s2 <= 5; s2++){
        var a2 = Math.PI * (s2 / 5);
        d += " Q " + (mx + mw * Math.cos(a2 - 0.3) * 0.9).toFixed(0) + " " +
             (my + mh * Math.sin(a2) * 0.85).toFixed(0) + " " +
             (mx + mw * Math.cos(a2) * 0.95).toFixed(0) + " " +
             (my + mh * Math.sin(a2) * 0.15).toFixed(0);
      }
      el("path", { d: d + " Z", fill: "#FFFFFF",
                   "fill-opacity": (0.008 + r() * 0.016).toFixed(4),
                   stroke: "#FFFFFF", "stroke-opacity": (0.05 + r() * 0.07).toFixed(3),
                   "stroke-width": 1 }, lMare);
    }

    var apexY = L.dome.apex, cx = L.dome.cx, reach = L.w * 0.58;
    for(var i = 0; i < N.streak; i++){
      var dir = (i % 2) ? 1 : -1;
      var sy  = apexY + 6 + r() * 32;
      var sx  = cx + dir * (24 + r() * reach * 0.33);
      var ex  = cx + dir * (reach * 1.1 + r() * reach * 0.6);
      var ey  = sy + L.h * 0.15 + r() * L.h * 0.34;
      el("path", {
        d: "M " + sx.toFixed(1) + " " + sy.toFixed(1) +
           " C " + (cx + dir * (reach * 0.35 + r() * reach * 0.25)).toFixed(1) + " " + (sy + 6 + r() * 44).toFixed(1) +
           ", " + (cx + dir * (reach * 0.8 + r() * reach * 0.3)).toFixed(1) + " " + (sy + 60 + r() * 170).toFixed(1) +
           ", " + ex.toFixed(1) + " " + ey.toFixed(1),
        fill: "none", stroke: "#FFFFFF",
        "stroke-opacity": (0.09 + r() * 0.32).toFixed(3),
        "stroke-width": (0.7 + r() * 1.7).toFixed(2),
        "stroke-linecap": "round"
      }, lStreak);
    }

    for(var v = 0; v < N.rille; v++){
      var depth = 0.12 + r() * 0.78;
      var x0 = -L.w * 0.2 + r() * L.w * 0.6;
      var span = L.w * (0.45 + r() * 0.8);
      var pts = "", wob2 = (r() - 0.5) * 26;
      for(var p = 0; p <= 10; p++){
        var px = x0 + span * (p / 10);
        var py = surfaceY(px, depth) + Math.sin(p * 1.3 + v) * (10 + r() * 22) + wob2;
        pts += (p ? " L " : "M ") + px.toFixed(1) + " " + py.toFixed(1);
      }
      el("path", { d: pts, fill: "none", stroke: "#FFFFFF",
                   "stroke-opacity": (0.08 + depth * 0.22).toFixed(3),
                   "stroke-width": (0.6 + depth * 1.3).toFixed(2),
                   "stroke-linecap": "round", "stroke-linejoin": "round" }, lRille);
    }

    var craters = [];
    var sizeScale = L.w / 1600;
    for(var c = 0; c < N.crater; c++){
      var ccx = -L.w * 0.11 + r() * L.w * 1.22;
      var depth2 = Math.pow(r(), 0.8);
      var ccy = surfaceY(ccx, depth2);
      if(ccy > L.dome.ground + 40) continue;
      var rx = (7 + r() * 26) * (0.32 + depth2 * 1.75) * sizeScale;
      var ry = rx * squash(depth2);
      var lift = domeY(ccx) - (ccy - ry);
      if(lift > 0) ccy += lift + 0.5;
      craters.push({ x: ccx, y: ccy, rx: rx, ry: ry, d: depth2, k: r() });
    }
    craters.sort(function(a, b){ return a.d - b.d; });

    craters.forEach(function(cr){
      var alpha = 0.10 + cr.d * 0.34;

      if(cr.rx > 26 * sizeScale && cr.d > 0.34){
        var rays = 7 + Math.floor(cr.k * 9);
        for(var e = 0; e < rays; e++){
          var a = (e / rays) * Math.PI * 2 + cr.k * 3;
          var len = cr.rx * (1.5 + r() * 2.3);
          el("line", {
            x1: (cr.x + Math.cos(a) * cr.rx * 1.05).toFixed(1),
            y1: (cr.y + Math.sin(a) * cr.ry * 1.05).toFixed(1),
            x2: (cr.x + Math.cos(a) * len).toFixed(1),
            y2: (cr.y + Math.sin(a) * len * squash(cr.d)).toFixed(1),
            stroke: "#FFFFFF", "stroke-opacity": (alpha * 0.34).toFixed(3),
            "stroke-width": (0.5 + r() * 0.7).toFixed(2), "stroke-linecap": "round"
          }, lCrater);
        }
      }

      el("ellipse", { cx: cr.x.toFixed(1), cy: cr.y.toFixed(1),
                      rx: cr.rx.toFixed(1), ry: cr.ry.toFixed(1),
                      fill: "#000000", "fill-opacity": .55, stroke: "#FFFFFF",
                      "stroke-opacity": alpha.toFixed(3),
                      "stroke-width": (0.6 + cr.d * 1.4).toFixed(2) }, lCrater);

      var C = Math.PI * (3 * (cr.rx + cr.ry) -
              Math.sqrt((3 * cr.rx + cr.ry) * (cr.rx + 3 * cr.ry)));
      el("ellipse", { cx: cr.x.toFixed(1), cy: cr.y.toFixed(1),
                      rx: cr.rx.toFixed(1), ry: cr.ry.toFixed(1),
                      fill: "none", stroke: "#FFFFFF",
                      "stroke-opacity": Math.min(0.92, alpha * 2.5).toFixed(3),
                      "stroke-width": (0.9 + cr.d * 1.8).toFixed(2),
                      "stroke-linecap": "round",
                      "stroke-dasharray": (C * 0.3).toFixed(1) + " " + C.toFixed(1),
                      "stroke-dashoffset": (C * (0.42 + cr.k * 0.12)).toFixed(1) }, lCrater);

      el("ellipse", { cx: (cr.x + cr.rx * 0.2).toFixed(1),
                      cy: (cr.y - cr.ry * 0.22).toFixed(1),
                      rx: (cr.rx * 0.68).toFixed(1), ry: (cr.ry * 0.6).toFixed(1),
                      fill: "#000000", "fill-opacity": .5, stroke: "none" }, lCrater);

      if(cr.rx > 44 * sizeScale && cr.k > 0.55){
        el("path", { d: "M " + (cr.x - cr.rx * 0.16).toFixed(1) + " " + (cr.y + cr.ry * 0.2).toFixed(1) +
                        " L " + cr.x.toFixed(1) + " " + (cr.y - cr.ry * 0.36).toFixed(1) +
                        " L " + (cr.x + cr.rx * 0.18).toFixed(1) + " " + (cr.y + cr.ry * 0.2).toFixed(1),
                     fill: "none", stroke: "#FFFFFF",
                     "stroke-opacity": (alpha * 1.5).toFixed(3),
                     "stroke-width": 1, "stroke-linejoin": "round" }, lCrater);
      }
    });

    for(var rg = 0; rg < N.ridge; rg++){
      var rd = 0.1 + r() * 0.5;
      var rx0 = -L.w * 0.08 + r() * L.w * 0.94;
      var rspan = L.w * (0.16 + r() * 0.33);
      var line = "";
      for(var q = 0; q <= 12; q++){
        var qx = rx0 + rspan * (q / 12);
        var qy = surfaceY(qx, rd) - Math.sin((q / 12) * Math.PI) * (16 + r() * 30) - r() * 9;
        line += (q ? " L " : "M ") + qx.toFixed(1) + " " + qy.toFixed(1);
      }
      el("path", { d: line, fill: "none", stroke: "#FFFFFF",
                   "stroke-opacity": (0.14 + rd * 0.3).toFixed(3),
                   "stroke-width": (0.7 + rd * 1.2).toFixed(2),
                   "stroke-linejoin": "round", "stroke-linecap": "round" }, lRidge);
    }

    for(var gr = 0; gr < N.grain; gr++){
      var gx = -L.w * 0.08 + r() * L.w * 1.16;
      var gd = Math.pow(r(), 0.55);
      var gy = surfaceY(gx, gd);
      if(gy > L.dome.ground + 30) continue;
      var dot = el("circle", { cx: gx.toFixed(1), cy: gy.toFixed(1),
                               r: (0.35 + r() * (0.5 + gd * 1.2)).toFixed(2),
                               fill: "#FFFFFF",
                               "fill-opacity": (0.05 + r() * (0.12 + gd * 0.3)).toFixed(3) }, lGrain);
      if(!reduced && r() < 0.22){
        dot.setAttribute("class", "grain");
        dot.style.animationDelay = (r() * 7.5).toFixed(2) + "s";
      }
    }

    for(var gl = 0; gl < N.glint; gl++){
      var lx = -40 + r() * (L.w + 80);
      var ld = Math.pow(r(), 0.7);
      var ly = surfaceY(lx, ld);
      if(ly > L.dome.ground) continue;
      var sp = el("circle", { cx: lx.toFixed(1), cy: ly.toFixed(1),
                              r: (0.8 + r() * 1.5).toFixed(2),
                              fill: "#FFFFFF", filter: fx("soft") }, lGlint);
      sp.style.opacity = ".5";
      if(!reduced){
        sp.setAttribute("class", "glint");
        sp.style.transformOrigin = lx.toFixed(1) + "px " + ly.toFixed(1) + "px";
        sp.style.animationDelay = (r() * 4.4).toFixed(2) + "s";
      }
    }
    for(var st = 0; st < N.star; st++){
      var sx2 = 40 + r() * (L.w - 80);
      var sd = 0.25 + r() * 0.7;
      var sy2 = surfaceY(sx2, sd);
      if(sy2 > L.dome.ground) continue;
      var star = el("path", {
        d: "M 0 -9 Q 1.2 -1.2 9 0 Q 1.2 1.2 0 9 Q -1.2 1.2 -9 0 Q -1.2 -1.2 0 -9 Z",
        fill: "#FFFFFF", filter: fx("soft"),
        transform: "translate(" + sx2.toFixed(1) + "," + sy2.toFixed(1) +
                   ") scale(" + (0.55 + r() * 0.85).toFixed(2) + ")"
      }, lGlint);
      star.style.opacity = ".6";
      if(!reduced){
        star.setAttribute("class", "glint");
        star.style.animationDelay = (r() * 4.4).toFixed(2) + "s";
      }
    }

    var dp = domePath();
    if(LOWFX){
      var flat = el("path", { d: dp, fill: "none", stroke: "#FFFFFF",
                              "stroke-width": 7, "stroke-linecap": "round" }, lRim);
      flat.style.opacity = ".13";
      if(!reduced) flat.setAttribute("class", "rimlight");
    } else {
      var glow = el("path", { d: dp, fill: "none", stroke: "#FFFFFF",
                              "stroke-width": 14, filter: "url(#haze)" }, lRim);
      glow.style.opacity = ".22";
      if(!reduced) glow.setAttribute("class", "rimlight");
    }
    el("path", { d: dp, fill: "none", stroke: "#FFFFFF", "stroke-opacity": .62,
                 "stroke-width": 2.1, "stroke-linecap": "round" }, lRim);
  }

  /* ============================================================
     2. DUST
     ============================================================ */
  function drawDust(){
    var g = G.dust, r = seeded(4211);
    var base = L.stemBase;
    for(var i = 0; i < L.count.dust; i++){
      var x = base.x - 100 + (r() - 0.5) * L.w * 0.2;
      var y = base.y + 160 + r() * L.h * 0.2;
      var d = el("circle", { cx: x.toFixed(1), cy: y.toFixed(1),
                             r: (0.5 + r() * 1.1).toFixed(2), fill: "#FFFFFF",
                             "fill-opacity": (0.06 + r() * 0.26).toFixed(3) }, g);
      if(!reduced && r() < 0.3){
        d.setAttribute("class", "twinkle");
        d.style.animationDelay = (r() * 5.5).toFixed(2) + "s";
      }
    }
  }

  /* ============================================================
     3. BEAM
     ============================================================ */
  function drawBeam(){
    var g = G.beam, r = seeded(7717);
    var e = L.earth;
    var x0 = 270 * e.s + e.tx, y0 = 400 * e.s + e.ty;
    var x1 = L.beamEnd.x, y1 = L.beamEnd.y;
    var reach = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
    var spreadMax = reach * 0.069;

    var layers = ["drift-a", "drift-b", "drift-c"].map(function(cls){
      var lg = el("g", {}, g);
      if(!reduced) lg.setAttribute("class", cls);
      return lg;
    });

    for(var i = 0; i < L.count.beam; i++){
      var t = Math.pow(r(), 0.72);
      var cx = x0 + (x1 - x0) * t;
      var cy = y0 + (y1 - y0) * t;
      var spread = 8 + t * spreadMax;
      var off = (r() + r() + r() - 1.5) / 1.5;
      var dot = el("circle", {
        cx: cx.toFixed(1), cy: (cy + off * spread).toFixed(1),
        r: (0.55 + r() * 1.5).toFixed(2), fill: "#FFFFFF",
        "fill-opacity": ((0.10 + r() * 0.48) * (1 - t * 0.42)).toFixed(3)
      }, layers[i % 3]);
      if(!reduced && r() < 0.34){
        dot.setAttribute("class", "twinkle");
        dot.style.animationDelay = (r() * 5.5).toFixed(2) + "s";
      }
    }
  }

  /* ============================================================
     4. STEMS — braided, now terminating exactly at the calyx base
        so the white hands off cleanly to the green
     ============================================================ */
  function drawStems(){
    var g = G.stems, base = L.stemBase, r = seeded(3313);
    var rise = base.y - L.blooms[1].y;

    function braid(bloom, phase, amp){
      var j = calyxBase(bloom);
      var c1x = base.x + Math.sin(phase) * amp;
      var c1y = base.y - rise * 0.36;
      var c2x = j.x - Math.sin(phase) * amp * 0.85;
      var c2y = base.y - rise * 0.72;
      return "M " + base.x.toFixed(1) + " " + base.y.toFixed(1) +
             " C " + c1x.toFixed(1) + " " + c1y.toFixed(1) +
             ", " + c2x.toFixed(1) + " " + c2y.toFixed(1) +
             ", " + j.x.toFixed(1) + " " + j.y.toFixed(1);
    }

    var amp = rise * 0.19;
    var main = [
      braid(L.blooms[0], 1.9, amp),
      braid(L.blooms[1], 0.0, amp * 0.35),
      braid(L.blooms[2], -1.9, amp)
    ];

    for(var m = 0; m < main.length; m++){
      el("path", { d: main[m], fill: "none", stroke: "#FFFFFF",
                   "stroke-opacity": .82, "stroke-width": 2.1,
                   "stroke-linecap": "round" }, g);
    }

    for(var i = 0; i < 16; i++){
      el("path", { d: main[i % 3], fill: "none", stroke: "#FFFFFF",
                   "stroke-opacity": (0.10 + r() * 0.34).toFixed(3),
                   "stroke-width": (0.6 + r() * 1.2).toFixed(2),
                   "stroke-linecap": "round",
                   transform: "translate(" + ((r() - 0.5) * 16).toFixed(1) + "," +
                              ((r() - 0.5) * 12).toFixed(1) + ") rotate(" +
                              ((r() - 0.5) * 3).toFixed(2) + " " + base.x + " " + base.y + ")" }, g);
    }

    for(var k = 0; k < 12; k++){
      var dir = (k % 2) ? 1 : -1;
      var len = L.w * (0.055 + r() * 0.16);
      el("path", {
        d: "M " + base.x + " " + base.y +
           " C " + (base.x + dir * len * 0.4).toFixed(1) + " " + (base.y + 6 + r() * 14).toFixed(1) +
           ", " + (base.x + dir * len * 0.75).toFixed(1) + " " + (base.y + 18 + r() * 26).toFixed(1) +
           ", " + (base.x + dir * len).toFixed(1) + " " + (base.y + 32 + r() * 40).toFixed(1),
        fill: "none", stroke: "#FFFFFF",
        "stroke-opacity": (0.10 + r() * 0.26).toFixed(3),
        "stroke-width": (0.6 + r() * 1.1).toFixed(2), "stroke-linecap": "round"
      }, g);
    }
  }

  /* ============================================================
     5. TRANSITION — the green.
        No cradle. A short smooth flare that carries the white braid
        up into the red and stops there. Roughly half the strokes are
        painted with the white-green-red gradient, so the colour
        actually fades from one into the other instead of meeting at
        a line. Each stroke is still laid down two to four times with
        the control points nudged, which is what keeps it looking
        drawn rather than plotted.
     ============================================================ */
  function drawTransition(b, host, r){
    var J   = calyxBase(b);
    var top = b.y + b.r * 0.04;        /* where the red head begins */
    var run = J.y - top;

    var g = el("g", {}, host);
    if(!reduced){
      g.setAttribute("class", "leaf");
      g.style.animationDelay = (r() * 9).toFixed(2) + "s";
    }

    var GREEN = ["#00C853", "#00C853", "#00A651", "#2BE07A"];

    /* a little green carried down over the white, so the lower join
       is also a fade rather than a stop */
    for(var c = 0; c < 3; c++){
      var drop = b.r * (0.18 + r() * 0.38);
      el("path", {
        d: "M " + (J.x + (r() - 0.5) * 7).toFixed(1) + " " + (J.y + drop).toFixed(1) +
           " Q " + (J.x + (r() - 0.5) * 10).toFixed(1) + " " + (J.y + drop * 0.4).toFixed(1) +
           " " + (J.x + (r() - 0.5) * 8).toFixed(1) + " " + (J.y - run * 0.18).toFixed(1),
        fill: "none", stroke: GREEN[(r() * 4) | 0],
        "stroke-opacity": (0.26 + r() * 0.4).toFixed(2),
        "stroke-width": ((0.7 + r() * 1.2) * SW).toFixed(2), "stroke-linecap": "round"
      }, g);
    }

    var count = Math.round(8 * (1 - b.dissolve)) + 3;

    for(var i = 0; i < count; i++){
      var side  = (i % 2) ? 1 : -1;
      var flare = b.r * (0.04 + r() * 0.28);
      /* a few carry on a short way into the red so the two overlap */
      var into  = r() < 0.34 ? b.r * (0.08 + r() * 0.13) : 0;

      var P0 = [ J.x + (r() - 0.5) * 9, J.y + (r() - 0.5) * 5 ];
      var C1 = [ b.x + side * flare * 0.28, J.y - run * 0.42 ];
      var C2 = [ b.x + side * flare * 0.78, J.y - run * 0.78 ];
      var P3 = [ b.x + side * flare, top - into ];

      var hue = r() < 0.45 ? "url(#g-blend)"
                           : (r() < 0.12 ? "#FF1B8D" : GREEN[(r() * 4) | 0]);
      var passes = 2 + ((r() * 3) | 0);

      for(var p = 0; p < passes; p++){
        var j = 1.6 + r() * 3.4;
        function nudge(pt){ return [ pt[0] + (r() - 0.5) * j, pt[1] + (r() - 0.5) * j ]; }
        var a = nudge(P0), b1 = nudge(C1), c1 = nudge(C2), d1 = nudge(P3);

        /* now and then the stroke runs on past the end */
        if(r() < 0.28){
          var ov = 0.07 + r() * 0.15;
          d1 = [ d1[0] + (d1[0] - c1[0]) * ov, d1[1] + (d1[1] - c1[1]) * ov ];
        }

        el("path", {
          d: "M " + a[0].toFixed(1) + " " + a[1].toFixed(1) +
             " C " + b1[0].toFixed(1) + " " + b1[1].toFixed(1) +
             ", " + c1[0].toFixed(1) + " " + c1[1].toFixed(1) +
             ", " + d1[0].toFixed(1) + " " + d1[1].toFixed(1),
          fill: "none", stroke: hue,
          "stroke-opacity": (0.34 + r() * 0.56).toFixed(2),
          "stroke-width": ((0.7 + r() * 1.5) * SW).toFixed(2),
          "stroke-linecap": "round"
        }, g);
      }

      /* on the dissolving blooms the green joins the network too */
      if(b.dissolve > 0.4 && r() < b.dissolve * 0.5){
        var np = cubicAt(P0, C1, C2, P3, 0.5 + r() * 0.4);
        var wrap = el("g", {}, g);
        if(!reduced){
          wrap.setAttribute("class", "node-wrap");
          wrap.style.animationDelay = (r() * 4.6).toFixed(2) + "s";
        }
        var open = r() < 0.6;
        var rad = (2.2 + r() * 2.2) * (L.w / 1600 * 0.45 + 0.55);
        var nd = el("circle", {
          cx: np[0].toFixed(1), cy: np[1].toFixed(1), r: rad.toFixed(2),
          fill: open ? "none" : "#00C853",
          stroke: open ? "#2BE07A" : "none",
          "stroke-width": open ? 1.3 : 0,
          filter: fx("soft")
        }, wrap);
        nd.style.opacity = "0.8";
        liveNodes.push({ node: nd, x: np[0], y: np[1], r: rad, base: 0.8 });
      }
    }
  }

  /* ============================================================
     6. BOUQUET
     ============================================================ */
  function drawBouquet(){
    var host = G.bouquet;
    liveNodes = [];
    liveRays  = [];

    L.blooms.forEach(function(b){
      var r = seeded(b.seed);
      var g = el("g", {}, host);

      drawTransition(b, g, r);

      var petals = Math.round(18 * (1 - b.dissolve)) + 1;
      for(var p = 0; p < petals; p++){
        var pa = -Math.PI / 2 + (r() - 0.5) * 2.3;
        var pl = b.r * (0.42 + r() * 0.62);
        var px = b.x + (r() - 0.5) * b.r * 0.5;
        var py = b.y + b.r * 0.06;
        el("path", {
          d: "M " + px.toFixed(1) + " " + py.toFixed(1) +
             " Q " + (px + Math.cos(pa) * pl * 0.55 + (r() - 0.5) * 26).toFixed(1) + " " +
                     (py + Math.sin(pa) * pl * 0.55).toFixed(1) + " " +
                     (px + Math.cos(pa) * pl + (r() - 0.5) * 20).toFixed(1) + " " +
                     (py + Math.sin(pa) * pl).toFixed(1),
          fill: "none", stroke: r() < 0.2 ? "#FF1B8D" : "#E01B24",
          "stroke-opacity": (0.62 + r() * 0.38).toFixed(2),
          "stroke-width": (1.3 + r() * 1.9).toFixed(2), "stroke-linecap": "round"
        }, g);
      }

      var pts = [];
      var count = Math.round(3 + b.dissolve * 17);
      for(var n = 0; n < count; n++){
        var na = -Math.PI / 2 + (r() - 0.5) * 2.35;
        var nr = b.r * (0.22 + r() * 0.86);
        pts.push({ x: b.x + Math.cos(na) * nr, y: b.y + Math.sin(na) * nr * 0.9,
                   open: r() < 0.5, rad: (3.2 + r() * 3.4) * (L.w / 1600 * 0.45 + 0.55),
                   jitter: r() });
      }

      var rayGroup = el("g", {}, g);
      var linked = 0;
      for(var a1 = 0; a1 < pts.length; a1++){
        for(var a2 = a1 + 1; a2 < pts.length; a2++){
          var dx = pts[a1].x - pts[a2].x, dy = pts[a1].y - pts[a2].y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if(dist > b.r * 0.66 || linked > 42) continue;
          var base = 0.14 + (1 - dist / (b.r * 0.66)) * 0.4;
          var line = el("line", {
            x1: pts[a1].x.toFixed(1), y1: pts[a1].y.toFixed(1),
            x2: pts[a2].x.toFixed(1), y2: pts[a2].y.toFixed(1),
            stroke: r() < 0.22 ? "#00C853" : "#FF4D5A",
            "stroke-width": (0.6 + r() * 0.9).toFixed(2), "stroke-linecap": "round"
          }, rayGroup);
          line.style.opacity = base.toFixed(3);
          if(!reduced){
            line.setAttribute("class", "ray");
            line.style.animationDelay = (r() * 6.2).toFixed(2) + "s";
          }
          liveRays.push({ node: line, x: (pts[a1].x + pts[a2].x) / 2,
                          y: (pts[a1].y + pts[a2].y) / 2, base: base });
          linked++;
        }
      }

      for(var s = 0; s < pts.length; s++){
        if(r() > 0.34) continue;
        var stemLine = el("line", {
          x1: pts[s].x.toFixed(1), y1: pts[s].y.toFixed(1),
          x2: (b.x + (r() - 0.5) * 14).toFixed(1), y2: (b.y + b.r * 0.62).toFixed(1),
          stroke: "#FF4D5A", "stroke-width": 0.6, "stroke-linecap": "round"
        }, rayGroup);
        stemLine.style.opacity = "0.2";
        liveRays.push({ node: stemLine, x: pts[s].x, y: pts[s].y + b.r * 0.3, base: 0.2 });
      }

      pts.forEach(function(pt){
        var wrap = el("g", {}, g);
        if(!reduced){
          wrap.setAttribute("class", "node-wrap");
          wrap.style.animationDelay = (pt.jitter * 4.6).toFixed(2) + "s";
        }
        var hue = pt.jitter < 0.2 ? "#FF1B8D" : (pt.jitter > 0.86 ? "#00C853" : "#E01B24");
        var circle = el("circle", {
          cx: pt.x.toFixed(1), cy: pt.y.toFixed(1), r: pt.rad.toFixed(2),
          fill: pt.open ? "none" : hue,
          stroke: pt.open ? "#FF6B7A" : "none",
          "stroke-width": pt.open ? 1.5 : 0,
          filter: fx("soft")
        }, wrap);
        circle.style.opacity = "0.86";
        liveNodes.push({ node: circle, x: pt.x, y: pt.y, r: pt.rad, base: 0.86 });
      });
    });
  }

  /* ============================================================
     7. EARTH + LIGHTHOUSE
     ============================================================ */
  function drawEarth(){
    var e = L.earth;
    var g = el("g", { transform: "translate(" + e.tx + "," + e.ty + ") scale(" + e.s + ")" }, G.earth);

    el("circle", { cx: 240, cy: 520, r: 58, fill: "none", stroke: "#1565D8",
                   "stroke-width": 3.4, "stroke-opacity": .95 }, g);
    el("path", {
      d: "M 208 496 C 222 476 244 482 250 496 C 258 482 276 490 272 506 C 280 518 274 534 262 538 " +
         "C 258 552 240 556 230 546 C 214 548 202 534 208 520 C 200 510 200 500 208 496 Z",
      fill: "none", stroke: "#00A651", "stroke-width": 3, "stroke-linejoin": "round"
    }, g);

    el("path", { d: "M 226 466 L 254 466 L 251.2 388 L 228.8 388 Z", fill: "none",
                 stroke: "#FFFFFF", "stroke-width": 2.2 }, g);
    var bands = [452, 434, 414];
    for(var i = 0; i < bands.length; i++){
      el("line", { x1: 228, y1: bands[i], x2: 252, y2: bands[i] - 9,
                   stroke: "#E01B24", "stroke-width": 5.5, "stroke-opacity": .92,
                   "stroke-linecap": "round" }, g);
    }

    el("path", { d: "M 210 400 L 222 388 L 258 388 L 270 400 L 258 412 L 222 412 Z",
                 fill: "#000000", stroke: "#FFFFFF", "stroke-width": 2.4,
                 "stroke-linejoin": "round" }, g);
    var lamp = el("path", { d: "M 232 400 L 240 393 L 248 400 L 240 407 Z",
                            fill: "#FFFFFF", filter: fx("softer") }, g);
    if(!reduced) lamp.setAttribute("class", "beacon");

    /* the only thing above the lantern: a plain rectangular cap
       resting straight on the hexagon */
    el("rect", { x: 224, y: 377, width: 32, height: 11,
                 fill: "#000000", stroke: "#FFFFFF", "stroke-width": 2.2,
                 "stroke-linejoin": "round" }, g);
  }

  /* ============================================================
     8. TYPE
     ============================================================ */
  function drawType(){
    var g = G.type;

    var t = el("text", { class: "t-title", x: L.title.x, y: L.title.y,
                         "text-anchor": "middle" }, g);
    t.style.fontSize = L.title.size + "px";
    t.style.letterSpacing = L.title.track + "px";
    t.textContent = "moonflower";

    var tg = el("text", { class: "t-tagline", x: L.tagline.x, y: L.tagline.y,
                          "text-anchor": "middle" }, g);
    tg.style.fontSize = L.tagline.size + "px";

    /* the tagline is assembled from plain runs and two links */
    function run(s){ tg.appendChild(document.createTextNode(s)); }
    function link(label, href){
      var a = el("a", { href: href, target: "_blank", rel: "noopener noreferrer" }, tg);
      /* older Safari still wants xlink on SVG anchors */
      a.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", href);
      el("tspan", {}, a).textContent = label;
    }
    run("~ from ");
    link("home", "https://aamir.consulting");
    run(" 2 the ");
    link("frontier", "https://www.linkedin.com/in/aamir-consulting/");
    run(" ~");

    L.notes.blocks.forEach(function(y, i){
      var n = el("text", { class: "t-note", x: L.notes.x, y: y,
                           "text-anchor": L.notes.anchor }, g);
      n.style.fontSize = L.notes.size + "px";
      L.copy[i].forEach(function(lineText, j){
        var ts = el("tspan", { x: L.notes.x, dy: j ? L.notes.lead : 0 }, n);
        ts.textContent = lineText;
      });
    });
  }

  /* ============================================================
     9. RENDER + LAYOUT SWITCHING
     ============================================================ */
  var activeKey = null;
  var BOX = null, REACH = 190;

  function pickLayout(){
    return (window.innerWidth / window.innerHeight) < 1.05 ? "portrait" : "landscape";
  }

  function render(){
    var key = pickLayout();
    if(key === activeKey) return;
    activeKey = key;
    L = LAYOUTS[key];
    SW = L.w / 1600 * 0.4 + 0.6;

    svg.setAttribute("viewBox", L.viewBox);
    for(var k in G) clear(G[k]);

    drawDust();
    drawMoon();
    drawBeam();
    drawStems();
    drawBouquet();
    drawEarth();
    drawType();

    var xs = L.blooms.map(function(b){ return b.x; });
    var ys = L.blooms.map(function(b){ return b.y; });
    BOX = { x: Math.min.apply(null, xs) - 60, y: Math.min.apply(null, ys) - 60,
            w: (Math.max.apply(null, xs) - Math.min.apply(null, xs)) + 120,
            h: (Math.max.apply(null, ys) - Math.min.apply(null, ys)) + 140 };
    REACH = L.w * 0.12;
  }

  /* ============================================================
     10. INTERACTION
     ============================================================ */
  var pointer = { x: 0, y: 0, live: false };
  var releasedAt = 0;

  function toScene(clientX, clientY){
    var box = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var scale = Math.min(box.width / vb.width, box.height / vb.height);
    return {
      x: vb.x + (clientX - (box.left + (box.width - vb.width * scale) / 2)) / scale,
      y: vb.y + (clientY - (box.top + (box.height - vb.height * scale) / 2)) / scale
    };
  }

  function paint(){
    var i, d, f, dx, dy, n;
    for(i = 0; i < liveNodes.length; i++){
      n = liveNodes[i]; f = 0;
      if(pointer.live){
        dx = n.x - pointer.x; dy = n.y - pointer.y;
        d = Math.sqrt(dx * dx + dy * dy);
        f = d < REACH ? 1 - d / REACH : 0;
        f = f * f;
      }
      n.node.style.opacity = (n.base + (1 - n.base) * f).toFixed(3);
      n.node.setAttribute("r", (n.r * (1 + f * 0.55)).toFixed(2));
    }
    for(i = 0; i < liveRays.length; i++){
      n = liveRays[i]; f = 0;
      if(pointer.live){
        dx = n.x - pointer.x; dy = n.y - pointer.y;
        d = Math.sqrt(dx * dx + dy * dy);
        f = d < REACH ? 1 - d / REACH : 0;
        f = f * f;
      }
      n.node.style.opacity = (n.base + (0.95 - n.base) * f).toFixed(3);
    }
  }

  if(!reduced && canHover){
    var queued = false;
    svg.addEventListener("mousemove", function(e){
      var p = toScene(e.clientX, e.clientY);
      pointer.x = p.x; pointer.y = p.y; pointer.live = true;
      if(!queued){ queued = true; requestAnimationFrame(function(){ queued = false; paint(); }); }
    });
    svg.addEventListener("mouseleave", function(){
      pointer.live = false; requestAnimationFrame(paint);
    });
  }

  if(!reduced && coarse){
    function track(e){
      if(!e.touches || !e.touches.length) return;
      var p = toScene(e.touches[0].clientX, e.touches[0].clientY);
      pointer.x = p.x; pointer.y = p.y; pointer.live = true;
      releasedAt = 0;
    }
    svg.addEventListener("touchstart", track, { passive: true });
    svg.addEventListener("touchmove",  track, { passive: true });
    svg.addEventListener("touchend", function(){ releasedAt = performance.now(); },
                         { passive: true });

    var faded = 1;
    (function idle(now){
      requestAnimationFrame(idle);
      if(document.hidden || faded < 0.04) return;

      if(releasedAt && now - releasedAt > 700) pointer.live = false;

      if(!pointer.live && BOX){
        pointer.x = BOX.x + BOX.w * (0.5 + 0.44 * Math.sin(now * 0.00031));
        pointer.y = BOX.y + BOX.h * (0.5 + 0.44 * Math.sin(now * 0.00047 + 1.1));
        pointer.live = true;
        paint();
        pointer.live = false;
      } else {
        paint();
      }
    })(performance.now());

    window.addEventListener("heroFade", function(e){ faded = e.detail; });
  }

  /* ============================================================
     11. PINNED CROSS-FADE INTO "THE IDEA"
     ============================================================ */
  (function crossfade(){
    var hero = document.getElementById("hero");
    var idea = document.getElementById("idea");
    var cue  = document.getElementById("cue");
    var ticking = false;

    function clamp(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }

    function update(){
      ticking = false;
      var p = clamp(window.pageYOffset / (window.innerHeight * 0.8));

      hero.style.opacity = (1 - p).toFixed(3);
      hero.style.transform = "scale(" + (1 - p * 0.05).toFixed(4) + ")";
      window.dispatchEvent(new CustomEvent("heroFade", { detail: 1 - p }));

      var q = clamp((p - 0.34) / 0.66);
      idea.style.opacity = q.toFixed(3);
      idea.style.transform = "translateY(" + ((1 - q) * 34).toFixed(1) + "px)";
      idea.style.pointerEvents = q > 0.5 ? "auto" : "none";
      idea.classList.toggle("revealed", q > 0.42);
      hero.style.pointerEvents = p > 0.6 ? "none" : "auto";

      cue.style.opacity = clamp(1 - p * 3).toFixed(3);
    }

    window.addEventListener("scroll", function(){
      if(!ticking){ ticking = true; requestAnimationFrame(update); }
    }, { passive: true });

    window.addEventListener("resize", function(){ render(); update(); });
    window.addEventListener("orientationchange", function(){
      setTimeout(function(){ render(); update(); }, 120);
    });

    render();
    update();
  })();

})();
</script>
